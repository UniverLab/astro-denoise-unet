name: Publish

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths: [pyproject.toml]
  workflow_dispatch:

jobs:
  publish:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: UniverLab/workflows/.github/workflows/python-publish.yml@main
    with:
      package-name: astro-denoise-unet
      python-version: "3.12"
    secrets: inherit
